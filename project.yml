name: yoUsage

options:
  bundleIdPrefix: com.yousage
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    # 앱 ↔ 위젯 공유 스토리지. entitlements 와 Info.plist 양쪽에서 이 값을 참조한다.
    # macOS 전용 "<TeamID>.<name>" 형식이라 프로비저닝 프로파일 없이도 빌드된다.
    APP_GROUP_ID: $(TeamIdentifierPrefix)com.yousage.shared
    # 본인 Team ID 를 넣으면 자동 서명으로 전환된다. 비워두면 ad-hoc("Sign to Run Locally").
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  yoUsage:
    type: application
    platform: macOS
    sources:
      - yoUsage
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yousage.app
    info:
      path: yoUsage/Info.plist
      properties:
        CFBundleDisplayName: yoUsage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        AppGroupIdentifier: $(APP_GROUP_ID)
    entitlements:
      path: yoUsage/yoUsage.entitlements
      properties:
        # 키체인(security CLI)과 ~/.claude, ~/.codex 를 읽어야 하므로 앱은 샌드박스를 끈다.
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: yoUsageWidget

  yoUsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - yoUsageWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yousage.app.widget
    info:
      path: yoUsageWidget/Info.plist
      properties:
        CFBundleDisplayName: yoUsage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: yoUsageWidget/yoUsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # App Group 컨테이너를 못 쓰는 ad-hoc 빌드용 대체 저장 위치 (SharedStore 참고)
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/yoUsage/
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
