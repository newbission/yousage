<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="36" y="43" fill="#92d8bc" font-size="13" letter-spacing="2">LOCAL CREDENTIALS. DIRECT REQUESTS. SHARED SNAPSHOTS.</text>
<g fill="#19343a" stroke="#385951"><rect x="36" y="92" width="235" height="104" rx="15"/><rect x="364" y="92" width="200" height="104" rx="15"/><rect x="654" y="92" width="230" height="104" rx="15"/><rect x="974" y="92" width="190" height="104" rx="15"/></g>
<g fill="#f0fcf6" font-size="20" font-weight="600" text-anchor="middle"><text x="153" y="131">CLI credentials</text><text x="464" y="131">yoUsage</text><text x="769" y="131">Usage API</text><text x="1069" y="131">Your surfaces</text></g>
<g fill="#a8c5bb" font-size="14" text-anchor="middle"><text x="153" y="163">Keychain / auth files</text><text x="464" y="163">Read · poll · snapshot</text><text x="769" y="163">Anthropic / ChatGPT</text><text x="1069" y="163">Menu bar · widget · CLI</text></g>
