<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="294" viewBox="0 0 1200 294" role="img" aria-labelledby="title desc">
<title id="title">How yoUsage gets your quota</title><desc id="desc">yoUsage reads local CLI credentials, requests usage from the corresponding service, and writes a snapshot. The menu bar displays usage; the widget and terminal read the snapshot.</desc>
